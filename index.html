  <meta charset="UTF-8">

  <title>Grade 3 Preposition Quiz</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .quiz-container {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 30px;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid #333;
    }

    h1 {
      text-align: center;
      color: #4da6ff;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    .question-block {
      margin-bottom: 25px;
      padding: 15px;
      background-color: #262626;
      border-radius: 8px;
      border-left: 4px solid #4da6ff;
    }

    .question-text {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 15px;
      color: #fff;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-label {
      background-color: #333;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
    }

    .option-label:hover {
      background-color: #444;
    }

    .option-label input {
      margin-right: 12px;
      accent-color: #4da6ff;
    }

    .btn {
      width: 100%;
      background-color: #4da6ff;
      color: #121212;
      border: none;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background-color: #3385d6;
    }

    .feedback {
      margin-top: 10px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 4px;
      display: none;
    }

    .feedback.correct {
      display: block;
      background-color: rgba(40, 167, 69, 0.2);
      color: #2ecc71;
      border: 1px solid #2ecc71;
    }

    .feedback.incorrect {
      display: block;
      background-color: rgba(220, 53, 69, 0.2);
      color: #e74c3c;
      border: 1px solid #e74c3c;
    }

    #result-box {
      display: none;
      text-align: center;
      padding: 20px;
      background-color: #262626;
      border-radius: 8px;
      margin-top: 20px;
    }

    #result-box h2 {
      color: #4da6ff;
      margin-bottom: 10px;
    }

    .score-text {
      font-size: 1.4rem;
      margin-bottom: 15px;
    }

    .retry-btn {
      background-color: #2ecc71;
      color: #121212;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .retry-btn:hover {
      background-color: #27ae60;
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <h1>Prepositions Quiz</h1>
    <p class="subtitle">Grade 3 English Grammar Practice</p>

    <form id="quiz-form">
      <div id="questions-wrapper"></div>
      <button type="button" class="btn" onclick="submitQuiz()">Submit Answers</button>
    </form>

    <div id="result-box">
      <h2>Quiz Results</h2>
      <p class="score-text" id="score-text"></p>
      <p id="grade-feedback"></p>
      <button class="retry-btn" onclick="location.reload()" style="margin-top: 15px;">Try Again</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        q: "1. The cat is sleeping _____ the rug.",
        options: ["on", "under", "in", "between"],
        answer: "on"
      },
      {
        q: "2. Put your toys _____ the box.",
        options: ["over", "in", "above", "on"],
        answer: "in"
      },
      {
        q: "3. The dog is sitting _____ the table.",
        options: ["under", "in", "on", "into"],
        answer: "under"
      },
      {
        q: "4. The bird flew _____ the house.",
        options: ["under", "in", "over", "at"],
        answer: "over"
      },
      {
        q: "5. She stands _____ her two best friends.",
        options: ["between", "in", "under", "on"],
        answer: "between"
      },
      {
        q: "6. We go to school _____ 8 o'clock.",
        options: ["on", "at", "in", "under"],
        answer: "at"
      },
      {
        q: "7. My birthday is _____ July.",
        options: ["on", "at", "in", "under"],
        answer: "in"
      },
      {
        q: "8. The shoes are standing _____ the door.",
        options: ["by", "under", "in", "over"],
        answer: "by"
      },
      {
        q: "9. The ball rolled _____ the hole.",
        options: ["into", "on", "above", "at"],
        answer: "into"
      },
      {
        q: "10. There is a picture hanging _____ the sofa.",
        options: ["under", "above", "in", "into"],
        answer: "above"
      },
      {
        q: "11. He jumps _____ the pool.",
        options: ["into", "on", "under", "at"],
        answer: "into"
      },
      {
        q: "12. We play soccer _____ Sunday.",
        options: ["in", "at", "on", "over"],
        answer: "on"
      },
      {
        q: "13. The teacher stood _____ the class.",
        options: ["in front of", "under", "into", "on"],
        answer: "in front of"
      },
      {
        q: "14. The car is parked _____ the garage.",
        options: ["outside", "into", "over", "on"],
        answer: "outside"
      },
      {
        q: "15. The moon shines _____ night.",
        options: ["in", "at", "on", "over"],
        answer: "at"
      }
    ];

    function renderQuiz() {
      const wrapper = document.getElementById("questions-wrapper");
      questions.forEach((qObj, index) => {
        const qBlock = document.createElement("div");
        qBlock.className = "question-block";
        qBlock.id = `q-block-${index}`;

        let optionsHtml = "";
        qObj.options.forEach(opt => {
          optionsHtml += `
            <label class="option-label">
              <input type="radio" name="q${index}" value="${opt}">
              ${opt}
            </label>
          `;
        });

        qBlock.innerHTML = `
          <p class="question-text">${qObj.q}</p>
          <div class="options">${optionsHtml}</div>
          <div class="feedback" id="feedback-${index}"></div>
        `;
        wrapper.appendChild(qBlock);
      });
    }

    function submitQuiz() {
      let score = 0;

      questions.forEach((qObj, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        const feedbackDiv = document.getElementById(`feedback-${index}`);

        if (selected) {
          if (selected.value === qObj.answer) {
            score++;
            feedbackDiv.className = "feedback correct";
            feedbackDiv.innerText = "✓ Correct!";
          } else {
            feedbackDiv.className = "feedback incorrect";
            feedbackDiv.innerText = `✗ Incorrect. Correct answer: "${qObj.answer}"`;
          }
        } else {
          feedbackDiv.className = "feedback incorrect";
          feedbackDiv.innerText = `✗ Not answered. Correct answer: "${qObj.answer}"`;
        }
      });

      const resultBox = document.getElementById("result-box");
      const scoreText = document.getElementById("score-text");
      const gradeFeedback = document.getElementById("grade-feedback");

      scoreText.innerText = `Your Score: ${score} / 15`;
      
      if (score >= 13) {
        gradeFeedback.innerText = "🌟 Excellent work! You know your prepositions really well!";
      } else if (score >= 9) {
        gradeFeedback.innerText = "👍 Good job! Keep practicing to get a full score.";
      } else {
        gradeFeedback.innerText = "📘 Keep learning! Try again to improve your score.";
      }

      resultBox.style.display = "block";
      resultBox.scrollIntoView({ behavior: 'smooth' });
    }

    renderQuiz();
  </script>
</body>
